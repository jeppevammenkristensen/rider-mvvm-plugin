# Any property can be overwritten from command-line via
#   -P<propertyName>=<value>

DotnetPluginId=ReSharperPlugin.MvvmPlugin
DotnetSolution=ReSharperPlugin.MvvmPlugin.sln
RiderPluginId=com.jetbrains.rider.plugins.mvvmplugin
# Plugin release version; bump when preparing a release, independently of ProductVersion.
PluginVersion=1.1.1.253

# Local development default. For release builds, pass -PBuildConfiguration=Release.
BuildConfiguration=Debug

# Never commit a real token. Set PublishToken in your user-level
# GRADLE_USER_HOME/gradle.properties (defaults to ~/.gradle/gradle.properties).
PublishToken="_PLACEHOLDER_"

# Production target: use the release value from the stable Rider metadata, never a snapshot.
# https://www.jetbrains.com/intellij-repository/releases/com/jetbrains/intellij/rider/riderRD/maven-metadata.xml
# Keep aligned with riderSdk in gradle/libs.versions.toml and SdkVersion in src/dotnet/Plugin.props.
# Next-release EAP coverage belongs only in riderSdkPreview in gradle/libs.versions.toml.
ProductVersion=2026.2.2

# Use the Kotlin standard library bundled with Rider instead of adding a separate dependency.
# https://plugins.jetbrains.com/docs/intellij/using-kotlin.html#kotlin-standard-library
kotlin.stdlib.default.dependency=false

# Required to download Rider artifacts from Maven (and not "binary" releases from CDN).
org.jetbrains.intellij.platform.buildFeature.useBinaryReleases=false
